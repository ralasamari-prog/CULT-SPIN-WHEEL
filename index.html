</style></head><body><img class="anniversary-backdrop" src="ddccfdd2abcd.jpg" alt="Third Anniversary — CULT — October 5th, 2026. Celebrating three years of growth, memories, and shared moments with CULT."><header><svg class="brand-logo" viewBox="280 185 440 180" role="img" aria-label="CULT"><image href="40cbbc7203be.png" width="1000" height="563"/></svg><div class="edition" dir="ltr">THE THIRD ANNIVERSARY<span>CULT IS CULTURE</span></div></header><main><section class="copy"><h1>ثلاث سنوات <br>معكم.</h1><p class="intro">لفّ العجلة، واكتشف هديّتك.</p><button class="primary" id="spin">لفّ العجلة</button><div class="result" role="status" aria-live="polite" aria-atomic="true"><h2 id="resultTitle"></h2><p id="resultText"></p></div></section><div class="wheel-wrap"><div class="pointer" aria-hidden="true"></div><svg class="wheel" viewBox="0 0 680 680" role="img" aria-label="عجلة كالت: خصومات، مق كالت، كوب مجاني، وحاول مرة أخرى. خصم 100% غير متاح."><circle cx="340" cy="340" r="337" fill="#f0ede8" stroke="#c9b983" stroke-width="1"/><g id="rotor"><path d="M340 340 L340.000 14.000 A326 326 0 0 1 516.249 65.751 Z" fill="#1c305b" stroke="#f0ede8" stroke-width="1.5"/><path d="M340 340 L516.249 65.751 A326 326 0 0 1 636.540 204.575 Z" fill="#e9af20" stroke="#f0ede8" stroke-width="1.5"/><path d="M340 340 L636.540 204.575 A326 326 0 0 1 662.682 386.395 Z" fill="#272525" stroke="#f0ede8" stroke-width="1.5"/><path d="M340 340 L662.682 386.395 A326 326 0 0 1 586.374 553.485 Z" fill="#f0ede8" stroke="#f0ede8" stroke-width="1.5"/><path d="M340 340 L586.374 553.485 A326 326 0 0 1 431.845 652.795 Z" fill="#1c305b" stroke="#f0ede8" stroke-width="1.5"/><path d="M340 340 L431.845 652.795 A326 326 0 0 1 248.155 652.795 Z" fill="#f0ede8" stroke="#f0ede8" stroke-width="1.5"/><path d="M340 340 L248.155 652.795 A326 326 0 0 1 93.626 553.485 Z" fill="#e9af20" stroke="#f0ede8" stroke-width="1.5"/><path d="M340 340 L93.626 553.485 A326 326 0 0 1 17.318 386.395 Z" fill="#272525" stroke="#f0ede8" stroke-width="1.5"/><path d="M340 340 L17.318 386.395 A326 326 0 0 1 43.460 204.575 Z" fill="#1c305b" stroke="#f0ede8" stroke-width="1.5"/><path d="M340 340 L43.460 204.575 A326 326 0 0 1 163.751 65.751 Z" fill="#f0ede8" stroke="#f0ede8" stroke-width="1.5"/><path d="M340 340 L163.751 65.751 A326 326 0 0 1 340.000 14.000 Z" fill="#e5e1d8" stroke="#f0ede8" stroke-width="1.5"/><text x="406.207150857736" y="80.51915120059311" fill="#e9af20" class="discount-label">خصم</text><text x="406.207150857736" y="124.51915120059311" fill="#e9af20" class="amount" direction="ltr">25%</text><text x="517.6011499732507" y="152.107727522858" fill="#1c305b" class="discount-label">خصم</text><text x="517.6011499732507" y="196.107727522858" fill="#1c305b" class="amount" direction="ltr">50%</text><text x="572.6080388420191" y="272.55601300577797" fill="#f0ede8" class="discount-label">خصم</text><text x="572.6080388420191" y="316.55601300577797" fill="#f0ede8" class="amount" direction="ltr">15%</text><text x="553.7635189083118" y="421.62252805544335" fill="#1c305b" class="gift-label"><tspan x="553.7635189083118">حاول</tspan><tspan x="553.7635189083118" dy="33">مرة أخرى</tspan></text><text x="467.0505921020655" y="503.6945802153275" fill="#e9af20" class="discount-label">خصم</text><text x="467.0505921020655" y="547.6945802153275" fill="#e9af20" class="amount" direction="ltr">20%</text><image href="44b6c0ba1efe.png" x="307.0" y="512.0" width="66" height="83" style="mix-blend-mode:multiply"/><text x="340.0" y="613.0" fill="#1c305b" class="gift-label">مق كالت</text><text x="212.94940789793446" y="503.6945802153275" fill="#1c305b" class="discount-label">خصم</text><text x="212.94940789793446" y="547.6945802153275" fill="#1c305b" class="amount" direction="ltr">30%</text><text x="126.23648109168818" y="403.6225280554433" fill="#f0ede8" class="discount-label">خصم</text><text x="126.23648109168818" y="447.6225280554433" fill="#f0ede8" class="amount" direction="ltr">5%</text><text x="107.3919611579808" y="272.5 <script>
'use strict';
const prizes=[{"label": "25%", "weight": 500, "kind": "discount"}, {"label": "50%", "weight": 10, "kind": "discount"}, {"label": "15%", "weight": 1500, "kind": "discount"}, {"label": "حاول مرة أخرى", "weight": 1190, "kind": "retry"}, {"label": "20%", "weight": 1000, "kind": "discount"}, {"label": "مق كالت", "weight": 50, "kind": "mug"}, {"label": "30%", "weight": 200, "kind": "discount"}, {"label": "5%", "weight": 3000, "kind": "discount"}, {"label": "10%", "weight": 2500, "kind": "discount"}, {"label": "كوب مجاني", "weight": 50, "kind": "cup"}, {"label": "100%", "weight": 0, "kind": "disabled"}];
const totalWeight=prizes.reduce((sum,p)=>sum+p.weight,0);
function randomUnit(){if(window.crypto&&window.crypto.getRandomValues){const a=new Uint32Array(1);window.crypto.getRandomValues(a);return a[0]/4294967296;}return Math.random();}
function pickPrize(r){const value=Math.max(0,Math.min(r,1-Number.EPSILON))*totalWeight;let cumulative=0;let lastEligible=0;for(let i=0;i<prizes.length;i++){if(prizes[i].weight<=0)continue;lastEligible=i;cumulative+=prizes[i].weight;if(value<cumulative)return i;}return lastEligible;}
function targetRotation(current,index,jitter){const step=360/prizes.length;const target=((360-(index+.5)*step+jitter)%360+360)%360;return current+1800+((target-current%360+360)%360);}
const spin=document.getElementById('spin'),rotor=document.getElementById('rotor'),title=document.getElementById('resultTitle'),detail=document.getElementById('resultText');let phase='ready',rotation=0;
spin.addEventListener('click',()=>{if(phase==='spinning')return;if(phase==='done'){phase='ready';title.textContent='';detail.textContent='';spin.textContent='لفّ العجلة';return;}phase='spinning';spin.disabled=true;spin.textContent='لحظات…';title.textContent='هديّتك بعد لحظات…';detail.textContent='';const index=pickPrize(randomUnit()),prize=prizes[index],start=rotation,end=targetRotation(start,index,(randomUnit()-.5)*(360/prizes.length)*.5);const duration=window.matchMedia('(prefers-reduced-motion: reduce)').matches?150:5200;let startTime;function animate(t){if(startTime===undefined)startTime=t;const progress=Math.min(1,(t-startTime)/duration),ease=1-Math.pow(1-progress,5);rotor.style.transform='rotate('+(start+(end-start)*ease)+'deg)';if(progress<1){requestAnimationFrame(animate);return;}rotation=end%360;rotor.style.transform='rotate('+rotation+'deg)';phase='done';spin.disabled=false;spin.textContent='الضيف التالي';title.textContent=prize.kind==='retry'?'حاول مرة أخرى':prize.kind==='discount'?'هديّتك: خصم '+prize.label:'هديّتك: '+prize.label;detail.textContent=prize.kind==='retry'?'شكرًا لكونك جزءًا من كالت.':'أظهر النتيجة لفريق كالت.';}requestAnimationFrame(animate);});
</script></body></html>
