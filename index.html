<script>
'use strict';
// Out of 10,000: 50% discount has a 0.1% chance on each independent spin.
const prizes=[{label:'25%',weight:500},{label:'50%',weight:10},{label:'15%',weight:1500},{label:'حاول مرة أخرى',weight:1240},{label:'20%',weight:1000},{label:'مق كالت',weight:50},{label:'30%',weight:200},{label:'5%',weight:3000},{label:'10%',weight:2500}];
function randomUnit(){if(window.crypto&&window.crypto.getRandomValues){const n=new Uint32Array(1);window.crypto.getRandomValues(n);return n[0]/4294967296;}return Math.random();}
function pickPrize(r){let cumulative=0;for(let i=0;i<prizes.length;i++){cumulative+=prizes[i].weight;if(r*10000<cumulative)return i;}return prizes.length-1;}
function targetRotation(current,index,jitter){const target=((360-(index*(360/prizes.length)+(180/prizes.length))+jitter)%360+360)%360;return current+1800+((target-current%360+360)%360);}
const spin=document.getElementById('spin'),rotor=document.getElementById('rotor'),title=document.getElementById('resultTitle'),detail=document.getElementById('resultText');
let phase='ready',rotation=0;
spin.addEventListener('click',()=>{if(phase==='spinning')return;if(phase==='done'){phase='ready';title.textContent='';detail.textContent='';spin.textContent='لفّ العجلة';return;}
phase='spinning';spin.disabled=true;spin.textContent='لحظات…';title.textContent='هديّتك بعد لحظات…';detail.textContent='';
const index=pickPrize(randomUnit()),start=rotation,end=targetRotation(start,index,(randomUnit()-.5)*24);const duration=window.matchMedia('(prefers-reduced-motion: reduce)').matches?150:5200;let startTime;
function animate(t){if(startTime===undefined)startTime=t;const progress=Math.min(1,(t-startTime)/duration),ease=1-Math.pow(1-progress,5);rotor.style.transform='rotate('+(start+(end-start)*ease)+'deg)';if(progress<1){requestAnimationFrame(animate);return;}rotation=end%360;rotor.style.transform='rotate('+rotation+'deg)';phase='done';spin.disabled=false;spin.textContent='الضيف التالي';title.textContent=index===3?'حاول مرة أخرى':index===5?'هديّتك: مق كالت':'هديّتك: خصم '+prizes[index].label;detail.textContent=index===3?'شكرًا لكونك جزءًا من كالت.':'أظهر النتيجة لفريق كالت.';}
requestAnimationFrame(animate);
});
